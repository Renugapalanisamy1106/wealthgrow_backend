# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bfsimf_clean?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# HIBERNATE DIALECT
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:bfsi-mutual-funds-super-secret-key-change-me-32bytes-min}
app.jwt.expiration-ms=86400000

# ===============================
# ALLOCATION (two-step invest) CONFIG
# ===============================
# Auto-allocate any PENDING invest transaction older than this many days.
app.allocation.auto-threshold-days=1
# How often the auto-allocation scheduler runs (milliseconds). Default 1 hour.
app.allocation.scheduler-rate-ms=3600000

# ===============================
# OPTIONAL (LOGGING)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
